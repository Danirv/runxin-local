name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
