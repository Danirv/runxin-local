name: Offline audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Offline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-offline.txt
      - name: Publication metadata check
        run: python scripts/publication_check.py
      - name: Documentation links and navigation
        run: python scripts/docs_check.py
      - name: Integration audit and protocol regressions
        run: python scripts/audit.py
      - name: F79D field surface audit
        run: python scripts/field_surface_audit.py
      - name: Unit tests
        run: python -m pytest -q -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning
      - name: Compile Python
        run: python -m compileall -q custom_components/ypsilon_local scripts tests
      - name: Install legacy BroadLink alongside the isolated async namespace
        run: python -m pip install --disable-pip-version-check broadlink==0.19.0
      - name: Regress legacy package coexistence with real async UDP
        run: python -m pytest -q tests/test_legacy_broadlink_coexistence.py tests/test_async_broadlink.py tests/test_compatibility.py tests/test_debug_connection.py tests/test_transport_and_client.py -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning

  home-assistant:
    name: Home Assistant regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-ha.txt
      - name: Test config flow, entities, controls and diagnostics
        run: python -m pytest -q -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning
      - name: Install legacy BroadLink alongside Core 2026.10.2
        run: python -m pip install --disable-pip-version-check broadlink==0.19.0
      - name: Verify Core and Runxin coexist with the legacy distribution
        run: python -m pytest -q tests/test_legacy_broadlink_coexistence.py tests/test_async_homeassistant.py -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning

  home-assistant-baseline:
    name: Home Assistant baseline 2026.10.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install earlier Home Assistant test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-ha-baseline.txt
      - name: Test all regressions on the earlier reported HA release
        run: python -m pytest -q -W error::RuntimeWarning -W error::pytest.PytestUnraisableExceptionWarning
