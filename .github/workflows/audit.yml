name: Offline audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Offline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest broadlink==0.19.0
      - name: Publication metadata check
        run: python scripts/publication_check.py
      - name: Integration audit and protocol regressions
        run: python scripts/audit.py
      - name: F79D field surface audit
        run: python scripts/field_surface_audit.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components/runxin_local scripts tests

  home-assistant:
    name: Home Assistant regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-ha.txt
      - name: Test config flow, entities, controls and diagnostics
        run: python -m pytest -q tests/test_homeassistant.py tests/test_control_guards.py
